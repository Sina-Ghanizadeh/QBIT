; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[qbit_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
framework = arduino
build_flags =
    -Iinclude
    -DNETWIZARD_USE_ASYNC_WEBSERVER=1
    -DCORE_DEBUG_LEVEL=0
    -DQBIT_VERSION=\"${sysenv.QBIT_VERSION}\"
    ; WebSocket backend — defaults in main.cpp: ws://localhost:3001/device
    ; Override via build flags for production or local testing:
    ; -DWS_HOST=\"YOUR_DEV_SERVER\"
    ; -DWS_PORT=5173
    ; -DWS_API_KEY=\"dev-test-key\"
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_ldf_mode = deep
extra_scripts = pre:scripts/patch_arduinowebsockets.py
lib_deps =
    olikraus/U8g2@=2.36.18
    ayushsharma82/NetWizard@=1.2.2
    ESP32Async/ESPAsyncWebServer@=3.10.0
    ESP32Async/AsyncTCP@=3.4.10
    bblanchon/ArduinoJson@=7.4.3
    end2endzone/NonBlockingRTTTL@=1.4.0
    gilmaimon/ArduinoWebsockets@=0.5.4
    knolleary/PubSubClient@=2.8
    ricmoo/QRCode@=0.0.1
monitor_speed = 115200

; Seeed XIAO ESP32-C3 (repo default / LabX boards)
[env:seeed_xiao_esp32c3]
platform = ${qbit_common.platform}
board = seeed_xiao_esp32c3
framework = ${qbit_common.framework}
build_flags = ${qbit_common.build_flags}
board_build.partitions = ${qbit_common.board_build.partitions}
board_build.filesystem = ${qbit_common.board_build.filesystem}
lib_compat_mode = ${qbit_common.lib_compat_mode}
lib_ldf_mode = ${qbit_common.lib_ldf_mode}
extra_scripts = ${qbit_common.extra_scripts}
lib_deps = ${qbit_common.lib_deps}
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = ${qbit_common.monitor_speed}

; Classic ESP32 — board = esp32dev (NOT an alias of the C3 env).
; Keep your own platformio.ini on the device side if it differs; this env exists
; so `pio run -e esp32dev` actually targets original ESP32 silicon.
[env:esp32dev]
platform = ${qbit_common.platform}
board = esp32dev
framework = ${qbit_common.framework}
build_flags = ${qbit_common.build_flags}
board_build.partitions = ${qbit_common.board_build.partitions}
board_build.filesystem = ${qbit_common.board_build.filesystem}
lib_compat_mode = ${qbit_common.lib_compat_mode}
lib_ldf_mode = ${qbit_common.lib_ldf_mode}
extra_scripts = ${qbit_common.extra_scripts}
lib_deps = ${qbit_common.lib_deps}
monitor_speed = ${qbit_common.monitor_speed}
