# Production compose. Expose only 2325 (frontend) to the internet.
# Backend 3001 is for API; admin UI on host 2326 (bind to internal/VPN in production).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: seanchangx/qbit-backend:latest
    container_name: qbit-backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "3001"
      - "3002"
    ports:
      # Admin UI (sessions, devices, ban). Restrict 2326 to internal/VPN; do not expose to internet.
      - "2326:3002"
    environment:
      - PORT=3001
      - ADMIN_PORT=3002
      - ADMIN_HOST=0.0.0.0
      # Admin login credentials (auto-generated if not provided)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Device WebSocket auth; must match firmware WS_API_KEY.
      - DEVICE_API_KEY=${DEVICE_API_KEY:-}
      - MAX_DEVICE_CONNECTIONS=${MAX_DEVICE_CONNECTIONS:-100}
      - MAX_DEVICE_CONNECTIONS_PER_IP=${MAX_DEVICE_CONNECTIONS_PER_IP:-10}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-}
      - LOCAL_REGISTRATION_ENABLED=${LOCAL_REGISTRATION_ENABLED:-true}
      - ALLOW_ANY_ORIGIN=${ALLOW_ANY_ORIGIN:-true}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
    volumes:
      - qbit-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:3001/health?format=json',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: seanchangx/qbit-frontend:latest
    container_name: qbit-frontend
    restart: unless-stopped
    ports:
      - "2325:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  qbit-data:
